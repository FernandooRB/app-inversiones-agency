name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create isolated test environment
        shell: python
        run: |
          import os
          from pathlib import Path
          import venv

          venv.EnvBuilder(with_pip=True).create(".venv")
          scripts = "Scripts" if os.name == "nt" else "bin"
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              output.write(str(Path(".venv", scripts).resolve()) + "\n")
      - name: Verify environment isolation
        run: python -c "import sys; assert sys.prefix != sys.base_prefix, 'CI requires a virtual environment'"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: >-
          python -m pytest --cov=portfolio_core --cov=reporting
          --cov=technical_analysis --cov=technical_market_data --cov=technical_backtesting
          --cov=watchlist_store --cov=technical_ui --cov-report=term-missing
