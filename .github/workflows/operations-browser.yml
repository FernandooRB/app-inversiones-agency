name: Operations browser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_PATH: ${{ runner.temp }}/sig-browser/node_modules
      SIG_BROWSER_OUTPUT: ${{ runner.temp }}/sig-browser-output
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create isolated environment
        shell: python
        run: |
          import os
          import venv
          from pathlib import Path
          venv.EnvBuilder(with_pip=True).create(".venv")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as target:
              target.write(str(Path(".venv/bin").resolve()) + "\n")
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-save --prefix "$RUNNER_TEMP/sig-browser" playwright-core@1.62.1
      - name: Download and reopen a fictional operations review in Chrome
        run: node scripts/check_operations_browser.cjs
      - name: Keep fictional browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-browser-evidence
          path: ${{ runner.temp }}/sig-browser-output
          retention-days: 7
