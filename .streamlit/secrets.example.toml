# Copy to secrets.toml locally or configure through the hosting secret manager.
# Never commit actual secrets. Authentication blocks all access until configured.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_SECRET"
client_id = "REPLACE_WITH_OIDC_CLIENT_ID"
client_secret = "REPLACE_WITH_OIDC_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[[access.identities]]
issuer = "https://accounts.google.com"
subject = "REPLACE_WITH_VERIFIED_PROVIDER_SUBJECT"
role = "ADMIN" # ADMIN, ANALYST, REVIEWER or VIEWER; required only for persistent cases

[workspace]
enabled = false # Enable only after configuring durable private storage and key custody
database_path = "D:/OptimizacionPortafolio/data/private/workspace/cases.db"
encryption_key = "REPLACE_WITH_FERNET_KEY_FROM_SECRET_MANAGER"

# Optional. Defaults to data/private/technical_watchlists.db under the app directory.
# Use durable private storage on hosting; this is independent of [workspace].
[technical_watchlist]
database_path = "D:/OptimizacionPortafolio/data/private/technical_watchlists.db"
