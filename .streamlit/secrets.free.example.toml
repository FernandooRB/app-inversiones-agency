# Streamlit Community Cloud: free pilot with downloadable analysis packages.
# Configure real values through Advanced settings > Secrets, never in Git.
[deployment]
storage_mode = "session_only"

[auth]
redirect_uri = "https://REPLACE_WITH_APP_HOST.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_SESSION_SECRET"
client_id = "REPLACE_WITH_GOOGLE_CLIENT_ID"
client_secret = "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[[access.identities]]
issuer = "https://accounts.google.com"
subject = "REPLACE_WITH_VERIFIED_GOOGLE_SUBJECT"
role = "ADMIN"

[workspace]
enabled = false # No durable case files on Community Cloud's temporary disk.

[technical_watchlist]
backend = "sqlite" # Blocked by session_only; use an external backend to enable persistent tracking.

[operations]
enabled = false
backup_enabled = false
